<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actin Calc — Casio fx-991EX ClassWiz clone</title>
<!--
  ACTIN CALC
  A faithful, fully functional clone of the Casio fx-991EX CLASSWIZ.

  FILES (only these three — no libraries, no build step, no internet needed):
    index.html  -> structure only (this file)
    style.css   -> all styling
    script.js   -> all logic (keypad is generated there from a key table)

  To run: just double-click index.html. Everything works offline.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================ CALCULATOR BODY ============================ -->
<div class="calcpage">

  <main class="calc" id="calc">

    <!-- TOP STRIP: the product name and nothing else (like the real ClassWiz bezel) -->
    <header class="topbar">
      <span class="brand">Actin Calc</span>
    </header>

    <div class="calcbody">

      <!-- ------------------------------ LCD SCREEN ------------------------------ -->
      <section class="screen">

        <!-- the recessed LCD window -->
        <div class="lcd" id="lcd">
          <!-- dot-matrix texture overlay (pure CSS, no images) -->
          <div class="lcd-dots" aria-hidden="true"></div>

          <!-- status indicators along the very top edge of the glass -->
          <div class="indicators" id="indicators"></div>

          <!-- the two text lines of the display -->
          <div class="lines" id="lines">
            <!-- TOP line: the expression being typed -->
            <div class="expr-wrap" id="exprWrap">
              <span class="expr-text" id="exprText"></span><span class="cursor" id="cursor">|</span>
            </div>
            <!-- BOTTOM line: the result, right aligned like a real Casio -->
            <div class="res-wrap" id="resWrap">
              <span class="res-text" id="resText"></span>
            </div>
          </div>

          <!-- Overlay area: on-screen menus, data editors (STAT/MATRIX/EQN...),
               matrix results and the BASE-N conversion strip live here.
               It is hidden while the two text lines are in use. -->
          <div class="editor" id="editor"></div>

          <!-- BASE-N conversion strip (only visible in BASE-N mode) -->
          <div class="basebar" id="baseBar"></div>
        </div>

        <!-- tiny bezel text under the glass, like the real thing -->
        <div class="bezel">
          <span class="bezel-l">ACTIN&nbsp;&nbsp;fx-991EX&nbsp;CLONE</span>
          <span class="bezel-r" id="solar">TWO WAY POWER</span>
        </div>
      </section>

      <!-- ------------------------------ KEYPAD ------------------------------ -->
      <!-- The keys are generated by script.js from a table (see buildKeypad()).
           The grid is 30 columns wide so that rows of 4, 5 and 6 keys
           all line up exactly, just like the real ClassWiz keypad. -->
      <section class="keypad" id="keypad"></section>

    </div>
  </main>

  <!-- ============================ HISTORY SIDEBAR ============================ -->
  <aside class="history" id="history">
    <div class="hist-head">
      <span>History</span>
      <button class="hist-clear" id="histClear" type="button">Clear</button>
    </div>
    <div class="hist-list" id="histList"></div>
    <div class="hist-help">
      <b>Keyboard:</b> 0-9 . + - * / ^ ( ) &nbsp;•&nbsp; <b>Enter</b> = &nbsp;•&nbsp;
      <b>Backspace</b> = DEL &nbsp;•&nbsp; <b>Esc</b> = AC &nbsp;•&nbsp;
      <b>s c t</b> sin/cos/tan &nbsp;•&nbsp; <b>l</b> log &nbsp;•&nbsp; <b>n</b> ln &nbsp;•&nbsp;
      <b>r</b> &radic; &nbsp;•&nbsp; <b>p</b> &pi; &nbsp;•&nbsp; <b>a</b> Ans &nbsp;•&nbsp;
      <b>x y m</b> variables &nbsp;•&nbsp; <b>&#8593; &#8595;</b> recall
    </div>
  </aside>

</div>

<script src="script.js"></script>
</body>
</html>
